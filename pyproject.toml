[project]
name = "vcnity-prototype"
version = "0.1.0"
description = "VCNITY 2026 AI project — proof-of-concept analysis pipeline (PRD v0.3 §4)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "reflex>=0.9,<0.10",
    "flask>=3.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pgserver>=0.1",
    "faster-whisper>=1.2",
    "pyannote.audio>=4.0",
    "sentence-transformers>=3.0",
    "bertopic>=0.17",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "ollama>=0.4",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "jiwer>=3.0",
    "av>=13",
    "pillow>=10",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
